# Base de données de démonstration (alternative à XAMPP).
# Démarrage :  docker compose up -d
# Puis lancer l'application avec :
#   DB_URL=jdbc:mysql://localhost:3307/agence_location  DB_PASSWORD=root
services:
  db:
    image: mariadb:10.11
    container_name: agence-location-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: agence_location
    ports:
      - "3307:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/mysql

volumes:
  db-data:
